name: Bug report
description: Something doesn't work, sounds wrong or looks broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The most useful thing you can add is the report from the app:
        press **Ctrl + Shift + R** in Laïyana right after the problem, then paste it below.
        It contains app state, audio settings, recent errors and the track playing (title, artist, album): no file paths. Read it before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report (Ctrl + Shift + R)
      description: Paste the report copied by the app.
      render: text
  - type: input
    id: output
    attributes:
      label: Audio output
      description: "Your DAC or sound card, and the mode: WASAPI exclusive, ASIO or normal."
      placeholder: "e.g. Topping E30, WASAPI exclusive"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
